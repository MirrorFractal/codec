name: Bug report
description: Crash, wrong output, parser error, or performance regression.
labels: [bug, triage]
body:
  - type: input
    id: version
    attributes:
      label: MFC version
      placeholder: "0.3.29"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux manylinux_2_34 x86_64
        - macOS arm64 (Apple Silicon)
        - Windows amd64
        - Browser WASM
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.x"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Minimum reproducible example, ideally a code snippet plus the input file size and format.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour (including the full traceback / error)
    validations:
      required: true
